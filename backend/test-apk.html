<!DOCTYPE html>
<html>
<head>
    <title>Test APK Generation</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 300px; padding: 8px; border: 1px solid #ccc; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
        #status { margin-top: 20px; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <h1>Test Real APK Generation</h1>
    
    <form id="apkForm">
        <div class="form-group">
            <label for="appName">App Name:</label>
            <input type="text" id="appName" name="appName" value="Test App" required>
        </div>
        
        <div class="form-group">
            <label for="websiteUrl">Website URL:</label>
            <input type="url" id="websiteUrl" name="websiteUrl" value="https://example.com" required>
        </div>
        
        <div class="form-group">
            <label for="packageName">Package Name (optional):</label>
            <input type="text" id="packageName" name="packageName" value="com.test.app">
        </div>
        
        <button type="submit">Generate Real APK</button>
    </form>
    
    <div id="status"></div>

    <script>
        document.getElementById('apkForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const statusDiv = document.getElementById('status');
            statusDiv.className = 'info';
            statusDiv.innerHTML = '🚀 Starting APK generation... This may take a few minutes.';
            
            try {
                const formData = new FormData();
                formData.append('name', document.getElementById('appName').value);
                formData.append('url', document.getElementById('websiteUrl').value);
                formData.append('customization', JSON.stringify({
                    packageName: document.getElementById('packageName').value
                }));
                
                console.log('Sending request to backend...');
                
                const response = await fetch('http://localhost:5000/api/generate-app', {
                    method: 'POST',
                    body: formData
                });
                
                console.log('Response status:', response.status);
                
                if (!response.ok) {
                    const errorData = await response.text();
                    throw new Error(`Server error ${response.status}: ${errorData}`);
                }
                
                const result = await response.json();
                console.log('Success result:', result);
                
                statusDiv.className = 'success';
                statusDiv.innerHTML = `
                    ✅ APK Generated Successfully!<br>
                    <strong>App:</strong> ${result.app.name}<br>
                    <strong>Size:</strong> ${result.app.apkSize}<br>
                    <strong>Type:</strong> ${result.app.type}<br>
                    <a href="http://localhost:5000${result.app.downloadLink}" 
                       download="${result.app.name}.apk"
                       style="display: inline-block; margin-top: 10px; padding: 8px 16px; background: #28a745; color: white; text-decoration: none; border-radius: 4px;">
                       📱 Download APK
                    </a>
                `;
                
            } catch (error) {
                console.error('Error:', error);
                statusDiv.className = 'error';
                statusDiv.innerHTML = `❌ Error: ${error.message}`;
            }
        });
    </script>
</body>
</html>
